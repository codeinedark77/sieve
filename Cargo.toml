[package]
name = "sieve"
version = "0.3.5"
edition = "2021"
description = "Local-first secrets & vulnerability scanner with LLM-assisted triage"
license = "MIT"

[lib]
name = "sieve"
path = "src/lib.rs"

[[bin]]
name = "sieve"
path = "src/main.rs"

[dependencies]
# Pinned to versions predating the Rust 2024 edition (stabilized Feb 2025):
# the apt-installed toolchain here is rustc 1.75, and several crates' newest
# releases now require edition2024 to even parse their manifest.
clap = { version = "=4.5.21", features = ["derive"] }
ignore = "=0.4.23"
regex = "=1.11.1"
once_cell = "=1.20.2"
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
anyhow = "=1.0.93"
colored = "=2.1.0"

# Transitive pins (pulled in by ignore/globset) for the same edition2024 reason.
globset = "=0.4.15"
walkdir = "=2.5.0"
same-file = "=1.0.6"
aho-corasick = "=1.1.3"
bstr = "=1.11.0"
memchr = "=2.7.4"
crossbeam-deque = "=0.8.5"

[dev-dependencies]
assert_cmd = "=2.0.16"
predicates = "=3.1.2"
tempfile = "=3.14.0"
getrandom = "=0.2.15"
fastrand = "=2.2.0"
predicates-core = "=1.0.8"
predicates-tree = "=1.0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
